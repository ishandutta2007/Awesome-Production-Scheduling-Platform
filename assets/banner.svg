<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#311042" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="bar1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>
    <linearGradient id="bar2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <linearGradient id="bar3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <style>
      .title { font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 46px; fill: #ffffff; }
      .subtitle { font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 20px; fill: #94a3b8; }
      .badge-text { font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 14px; fill: #f8fafc; }
      
      @keyframes pulseGlow {
        0% { opacity: 0.3; transform: scale(0.98); }
        50% { opacity: 0.8; transform: scale(1.02); }
        100% { opacity: 0.3; transform: scale(0.98); }
      }
      @keyframes moveGantt {
        0% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: -40; }
      }
      .animated-pulse { animation: pulseGlow 4s ease-in-out infinite; transform-origin: center; }
      .animated-dash { stroke-dasharray: 8 6; animation: moveGantt 2s linear infinite; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="300" rx="16" fill="url(#bgGrad)" />

  <!-- Animated Glowing Geometric Accents -->
  <circle cx="150" cy="60" r="180" fill="#6366f1" opacity="0.15" class="animated-pulse" />
  <circle cx="1050" cy="240" r="160" fill="#ec4899" opacity="0.15" class="animated-pulse" />

  <!-- Grid Pattern Overlay -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="300" />
    <line x1="300" y1="0" x2="300" y2="300" />
    <line x1="500" y1="0" x2="500" y2="300" />
    <line x1="700" y1="0" x2="700" y2="300" />
    <line x1="900" y1="0" x2="900" y2="300" />
    <line x1="1100" y1="0" x2="1100" y2="300" />
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
  </g>

  <!-- Gantt Chart Illustration (Dynamic / Modern Ops Theme) -->
  <g transform="translate(720, 55)" opacity="0.95">
    <!-- Gantt Background Card -->
    <rect x="0" y="0" width="420" height="190" rx="12" fill="#0f172a" stroke="#334155" stroke-width="2" />
    
    <!-- Timeline Header -->
    <line x1="20" y1="40" x2="400" y2="40" stroke="#334155" stroke-width="1" />
    <text x="30" y="28" fill="#64748b" font-family="Segoe UI" font-size="12" font-weight="600">SHIFT 1</text>
    <text x="160" y="28" fill="#64748b" font-family="Segoe UI" font-size="12" font-weight="600">SHIFT 2</text>
    <text x="290" y="28" fill="#64748b" font-family="Segoe UI" font-size="12" font-weight="600">SHIFT 3</text>

    <!-- Workstation / Job Bars -->
    <!-- Line 1 -->
    <rect x="30" y="55" width="110" height="24" rx="6" fill="url(#bar1)" />
    <rect x="150" y="55" width="160" height="24" rx="6" fill="url(#bar2)" />
    <!-- Line 2 -->
    <rect x="60" y="95" width="140" height="24" rx="6" fill="url(#bar3)" />
    <rect x="210" y="95" width="120" height="24" rx="6" fill="url(#bar1)" />
    <!-- Line 3 -->
    <rect x="30" y="135" width="220" height="24" rx="6" fill="url(#bar2)" />
    <rect x="260" y="135" width="110" height="24" rx="6" fill="url(#bar3)" />

    <!-- Animated Dependency Connector Line -->
    <path d="M 140 67 L 150 67 M 200 107 L 210 107" stroke="#e2e8f0" stroke-width="2" class="animated-dash" />
  </g>

  <!-- Left Content Block -->
  <g transform="translate(60, 75)">
    <!-- Top Category Tag -->
    <rect x="0" y="0" width="260" height="30" rx="15" fill="url(#accentGrad)" />
    <text x="130" y="20" text-anchor="middle" class="badge-text">⚙️ APS &amp; SHOP-FLOOR OPTIMIZATION</text>

    <!-- Main Title -->
    <text x="0" y="85" class="title">Awesome Production Scheduling</text>

    <!-- Subtitle -->
    <text x="0" y="125" class="subtitle">Curated SaaS Platforms, APS Engines &amp; Open-Source Solvers</text>

    <!-- Decorative Bottom Accent Line -->
    <rect x="0" y="145" width="480" height="4" rx="2" fill="url(#accentGrad)" />
  </g>
</svg>
